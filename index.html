<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- SEO & Meta -->
    <title>PactoPay — Custodia Inteligente y Pagos Internacionales en Stellar</title>
    <meta name="description" content="Plataforma de pagos internacionales y custodia protegida para freelancers LATAM. Contratos inteligentes sobre Stellar con USDC. Sin comisiones ocultas." />
    <meta name="keywords" content="Stellar, Soroban, USDC, escrow, custodia, freelancers, LATAM, pagos internacionales, smart contracts" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pactopay.netlify.app/" />
    <meta property="og:title" content="PactoPay — Custodia Inteligente en Stellar" />
    <meta property="og:description" content="Plataforma de pagos internacionales y custodia protegida para freelancers LATAM. Contratos inteligentes sobre Stellar con USDC." />
    <meta property="og:image" content="https://pactopay.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PactoPay — Custodia Inteligente en Stellar" />
    <meta name="twitter:description" content="Plataforma de pagos internacionales y custodia protegida para freelancers LATAM." />
    <meta name="twitter:image" content="https://pactopay.netlify.app/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col"
  >
    <!-- Noscript fallback -->
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;text-align:center;padding:2rem;background:#FAFAFA;color:#1C1B1F;">
        <div>
          <h1 style="font-size:1.5rem;margin-bottom:1rem;">PactoPay requiere JavaScript habilitado</h1>
          <p style="max-width:480px;margin:0 auto;color:#49454F;">
            Para usar la plataforma de custodia y pagos internacionales, por favor habilitá JavaScript en tu navegador o desactivá los bloqueadores de scripts para esta página.
          </p>
        </div>
      </div>
    </noscript>

    <!-- App root with loading skeleton -->
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#FAFAFA;">
        <div style="text-align:center;">
          <div style="width:48px;height:48px;border:4px solid #E0E0E0;border-top-color:#00236f;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem;"></div>
          <p style="color:#49454F;font-family:system-ui,sans-serif;">Cargando PactoPay...</p>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
